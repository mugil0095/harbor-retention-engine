name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests pipelines dashboards

      - name: Run tests with coverage
        run: pytest --cov=harbor --cov-report=term-missing -q

      - name: Smoke-test the full pipeline on synthetic data
        run: |
          python pipelines/run_data_generation.py
          python pipelines/run_training_pipeline.py
          python pipelines/run_monitoring.py
          python pipelines/run_segmentation.py
          python pipelines/run_batch_scoring.py
          python pipelines/run_cohort_analysis.py
          python pipelines/run_evaluation.py

      # Docker has never been built anywhere else in this project's history
      # (no Docker in the local dev sandbox) -- this is the first real,
      # CI-verified build+run. Uses the data/models_store the smoke-test step
      # above just generated as the build context, so no extra setup is
      # needed.
      - name: Build and start Docker services (API + dashboard)
        run: docker compose -f deployment/docker-compose.yml up --build -d --wait

      - name: Verify API /health via Docker
        run: curl -sf http://localhost:8000/health

      - name: Verify dashboard is serving via Docker
        run: curl -sf http://localhost:8501/_stcore/health

      - name: Show container logs
        if: always()
        run: docker compose -f deployment/docker-compose.yml logs

      - name: Tear down Docker services
        if: always()
        run: docker compose -f deployment/docker-compose.yml down
